name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-gcc-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Fetch pinned llama.cpp (vocab files for the tokenizer verification test)
        run: python3 scripts/fetch_upstream.py llama.cpp
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build
      - name: Test
        # Tests labelled "slow" run here too; locally `ctest -LE slow` skips them.
        run: ctest --test-dir build --output-on-failure

  linux-clang-sanitizers:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev clang
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-llama-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Fetch pinned llama.cpp
        run: python3 scripts/fetch_upstream.py llama.cpp
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCLUSTERLM_ENABLE_LLAMA=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Tokenizer vocab verification (qwen2 + qwen35 vs llama.cpp's own vocab tests)
        run: ctest --test-dir build --output-on-failure -L vocab --no-tests=error

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Locate OpenSSL
        # The runner image ships OpenSSL 3 under Program Files; fall back to vcpkg (slow) if it is missing.
        shell: pwsh
        run: |
          if (Test-Path "C:/Program Files/OpenSSL/include/openssl/ssl.h") {
            "CLM_CMAKE_OPENSSL=-DOPENSSL_ROOT_DIR=C:/Program Files/OpenSSL" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            vcpkg install openssl:x64-windows
            "CLM_CMAKE_OPENSSL=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "$env:CLM_CMAKE_OPENSSL"
      - name: Build
        # -k 0: report every MSVC error in one run instead of stopping at the first.
        run: cmake --build build -- -k 0
      - name: Test
        # POSIX-only cases are compiled out or skip with a doctest MESSAGE under _WIN32.
        run: ctest --test-dir build --output-on-failure

  windows-mingw-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 and OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix libssl-dev
      - name: Compile every source for Windows (-fsyntax-only, warnings as errors)
        run: scripts/check_windows_compile.sh

  linux-strata-cuda-build:
    # The Strata backend against the pinned, patched upstream (docs/backends/strata-port.md). The runner has no GPU:
    # everything compiles and links, the CPU kernel parity tests run, device cases report a skip.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev nvidia-cuda-toolkit g++-12
      - name: Fetch upstream and apply the ClusterLM patches
        run: python3 scripts/fetch_upstream.py --apply-patches strata strata-ggml
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          -DCLUSTERLM_ENABLE_STRATA=ON -DCMAKE_CUDA_HOST_COMPILER=g++-12 "-DCMAKE_CUDA_ARCHITECTURES=86;89"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  qualification-doc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen_qualification_md.py --check

  # Windows installers (docs/packaging.md). Separate build tree: static OpenSSL + static MSVC runtime so the
  # executables need no DLL that Windows does not already have. Gated on the regular MSVC job (build + tests).
  windows-packaging:
    needs: windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install OpenSSL (vcpkg, static)
        run: vcpkg install openssl:x64-windows-static
      - name: Configure (Release, static runtime)
        run: >
          cmake -S . -B build-pkg -G Ninja -DCMAKE_BUILD_TYPE=Release -DCLUSTERLM_BUILD_TESTS=OFF
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build-pkg
      - name: Install into staging directories (one per package)
        run: |
          cmake --install build-pkg --config Release --component father --prefix stage/father
          cmake --install build-pkg --config Release --component node --prefix stage/node
          Get-ChildItem -Recurse stage | Where-Object { -not $_.PSIsContainer } | ForEach-Object { $_.FullName }
      - name: Executables import only Windows system DLLs
        run: packaging/check-dependencies.ps1 -Stage stage/father, stage/node
      - name: Signing configuration
        id: signing
        shell: pwsh
        env:
          CLUSTERLM_SIGN_CERT_BASE64: ${{ secrets.CLUSTERLM_SIGN_CERT_BASE64 }}
          CLUSTERLM_SIGN_CERT_PASSWORD: ${{ secrets.CLUSTERLM_SIGN_CERT_PASSWORD }}
          CLUSTERLM_SIGN_TIMESTAMP_URL: ${{ vars.CLUSTERLM_SIGN_TIMESTAMP_URL }}
        run: |
          $state = packaging/sign.ps1 -Probe
          "state=$state" >> $env:GITHUB_OUTPUT
          if ($state -ne 'signed') { Write-Host "::warning title=UNSIGNED BUILD::CLUSTERLM_SIGN_* are not configured; the MSI files will be named -UNSIGNED" }
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix --version
      - name: Build MSI packages
        shell: pwsh
        env:
          CLUSTERLM_SIGN_CERT_BASE64: ${{ secrets.CLUSTERLM_SIGN_CERT_BASE64 }}
          CLUSTERLM_SIGN_CERT_PASSWORD: ${{ secrets.CLUSTERLM_SIGN_CERT_PASSWORD }}
          CLUSTERLM_SIGN_TIMESTAMP_URL: ${{ vars.CLUSTERLM_SIGN_TIMESTAMP_URL }}
        run: >
          packaging/build-msi.ps1 -StageRoot stage -OutDir packaging/out
          -OpenSslLicense "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/share/openssl/copyright"
      - name: Validate MSI packages (wix msi validate, ICE)
        run: |
          Get-ChildItem packaging/out -Filter *.msi | ForEach-Object {
            Write-Host "== $($_.Name)"
            # ICE38/ICE43/ICE57 are known false positives for a per-machine package: they treat ProgramMenuFolder as a
            # per-user location, but with Scope="perMachine" (ALLUSERS=1) it is the all-users Start menu, and the
            # shortcut's HKLM KeyPath is correct. Every other ICE stays enforced (docs/packaging.md).
            wix msi validate -sice ICE38 -sice ICE43 -sice ICE57 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "ICE validation failed for $($_.Name)" }
          }
      - name: Upload MSI packages
        uses: actions/upload-artifact@v4
        with:
          name: clusterlm-msi-${{ steps.signing.outputs.state }}
          path: |
            packaging/out/*.msi
            packaging/out/packaging-manifest.json
            packaging/out/signing-status.json
          if-no-files-found: error
      - name: Smoke test, Node (install, verify, uninstall)
        run: packaging/smoke-test.ps1 -Package Node -Msi (Get-ChildItem packaging/out -Filter 'ClusterLM-Node-*.msi').FullName -LogDir packaging/out/logs
      - name: Smoke test, Father (install, verify, uninstall)
        run: packaging/smoke-test.ps1 -Package Father -Msi (Get-ChildItem packaging/out -Filter 'ClusterLM-Father-*.msi').FullName -LogDir packaging/out/logs
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clusterlm-msi-logs
          path: packaging/out/logs
          if-no-files-found: ignore
