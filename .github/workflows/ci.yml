name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-gcc-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build
      - name: Test
        # Tests labelled "slow" run here too; locally `ctest -LE slow` skips them.
        run: ctest --test-dir build --output-on-failure

  linux-clang-sanitizers:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev clang
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Locate OpenSSL
        # The runner image ships OpenSSL 3 under Program Files; fall back to vcpkg (slow) if it is missing.
        shell: pwsh
        run: |
          if (Test-Path "C:/Program Files/OpenSSL/include/openssl/ssl.h") {
            "CLM_CMAKE_OPENSSL=-DOPENSSL_ROOT_DIR=C:/Program Files/OpenSSL" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            vcpkg install openssl:x64-windows
            "CLM_CMAKE_OPENSSL=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "$env:CLM_CMAKE_OPENSSL"
      - name: Build
        # -k 0: report every MSVC error in one run instead of stopping at the first.
        run: cmake --build build -- -k 0
      - name: Test
        # POSIX-only cases are compiled out or skip with a doctest MESSAGE under _WIN32.
        run: ctest --test-dir build --output-on-failure

  windows-mingw-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 and OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix libssl-dev
      - name: Compile every source for Windows (-fsyntax-only, warnings as errors)
        run: scripts/check_windows_compile.sh

  qualification-doc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen_qualification_md.py --check
